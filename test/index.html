<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Visibility Check</title>
    <style>
        .target {
            height: 200px;
            background-color: lightcoral;
            margin: 110vh 0; /* Ensure the element is out of view initially */
        }
    </style>
</head>
<body>

<div class="target" id="target"></div>

<script>
    function isElementInViewport(el) {
    debugger    // viewPortHeight 兼容所有浏览器写法
    const viewPortHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight 
    const offsetTop = el.offsetTop
    const scrollTop = document.documentElement.scrollTop
    const top = offsetTop - scrollTop
    return top <= viewPortHeight&&top>=0



    }

    const target = document.getElementById('target');

    window.addEventListener('scroll', () => {
        if (isElementInViewport(target)) {
            console.log('Element is in view!');
        } else {
            console.log('Element is out of view!');
        }
    });

    // Initial check
    if (isElementInViewport(target)) {
        console.log('Element is initially in view!');
    } else {
        console.log('Element is initially out of view!');
    }
</script>

</body>
</html>
