<style>
    @import url('https://fonts1111.googleapis.com/css2?family=Roboto:wght@300&display=swap');

<style>
/* fonts.css */
@font-face {
  font-family: MyHelvetica;
  src: local("Helvetica Neue Bold111"), local("HelveticaNeue-Bold"),
    url(MgOpenModernaBold.ttf);
  font-weight: bold;
}


</style>
<body class="container"  >
    <div id="parent">
        Parent div
        <button id="child">Click me</button>
      </div>
      
      <script>
// 父容器上的事件处理程序
document.getElementById('parent').addEventListener('click', function() {
    console.log('Parent clicked');
});
// 按钮上的事件处理程序 2
document.getElementById('child').addEventListener('click', function(event) {
    console.log('Child click handler 2');
});
// 按钮上的事件处理程序 1
document.getElementById('child').addEventListener('click', function(event) {
    console.log('Child click handler 1');
    event.stopImmediatePropagation(); // 完全阻止事件传播
});



// 在页面加载时运行
window.onload = function() {
    document.getElementById('child').click(); // 模拟点击按钮
};

    </script>
