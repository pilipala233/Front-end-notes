<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 watch Example</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Vue 3 watch Example</h1>
        <p>User Name: {{ state.user.name }}</p>
        <p>Is Logged In: {{ state.isLoggedIn }}</p>

        <button @click="changeName">Change Name</button>
        <button @click="toggleLogin">Toggle Login Status</button>
    </div>

    <script>
        const { createApp, reactive, watch } = Vue;

        createApp({
            setup() {
                // 创建响应式对象
                const state = reactive({
                    user: {
                        name: 'John',
                        age: 30
                    },
                    isLoggedIn: false
                });

                // 监听整个 reactive 对象的变化
                watch(()=>state.isLoggedIn, (newState, oldState) => {
                    console.log('State changed:');
                    console.log('New State:', newState);
                    console.log('Old State:', oldState);
                }, { deep: true });

                // 修改 state 的方法
                const changeName = () => {
                    state.user.name = state.user.name === 'John' ? 'Jane' : 'John';
                };

                const toggleLogin = () => {
                    state.isLoggedIn = !state.isLoggedIn;
                };

                return {
                    state,
                    changeName,
                    toggleLogin
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
